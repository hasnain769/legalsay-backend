name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - main  # Make sure this matches your branch name (main or master)

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          script: |
            # --- CONFIGURATION ---
            PROJECT_DIR="/home/opc/legalsay-backend"
            SERVICE_NAME="fastapi_app"

            # 1. Enable Strict Mode
            set -e

            echo "🚀 Starting Deployment to $PROJECT_DIR..."

            # 2. Check if directory exists
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "❌ Error: Project directory not found!"
              exit 1
            fi
            cd "$PROJECT_DIR"

            # 3. Force Sync with GitHub
            echo "⬇️ Syncing code..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # 4. Update Dependencies
            echo "📦 Installing dependencies..."
            source venv/bin/activate
            pip install --upgrade pip
            pip install --no-cache-dir -r requirements.txt

            # 5. Restart Backend
            echo "🔄 Restarting Systemd Service..."
            sudo systemctl restart $SERVICE_NAME

            # 6. Verify Health
            echo "🏥 Verifying Health..."
            sleep 5
            
            if systemctl is-active --quiet $SERVICE_NAME; then
              echo "✅ SUCCESS: Service is running."
              sudo systemctl status $SERVICE_NAME --no-pager
            else
              echo "❌ FAILURE: Service crashed on startup!"
              sudo systemctl status $SERVICE_NAME --no-pager
              exit 1
            fi